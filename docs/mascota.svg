<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Mascota de Grupo Cardinal</title>
  <desc id="d">Personaje redondo y blanco con antenas, lentes redondos y un gafete rojo con un candado.</desc>
  <defs>
    <linearGradient id="cuerpo" gradientUnits="userSpaceOnUse" x1="70" y1="50" x2="440" y2="460">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#EDF0F4"/>
      <stop offset="1" stop-color="#B7C1CC"/>
    </linearGradient>
    <linearGradient id="brazo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B7C1CC"/>
    </linearGradient>
    <linearGradient id="gafete" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F65050"/>
      <stop offset="1" stop-color="#B32626"/>
    </linearGradient>
  </defs>

  <!-- Antenas -->
  <g fill="none" stroke="#BEC8D2" stroke-width="13" stroke-linecap="round">
    <path d="M196 68 C180 47 158 35 128 35"/>
    <path d="M316 68 C332 47 354 35 384 35"/>
  </g>

  <!-- Patas -->
  <g fill="#AEB9C5">
    <rect x="192" y="410" width="43" height="60"/>
    <rect x="277" y="410" width="43" height="60"/>
  </g>

  <!-- Cuerpo -->
  <path d="M256 42 C370 42 446 130 446 240 C446 350 360 430 256 430 C152 430 66 350 66 240 C66 130 142 42 256 42 Z"
        fill="url(#cuerpo)" stroke="#C3CCD6" stroke-width="3"/>

  <!-- Cordón del gafete -->
  <path d="M92 214 Q196 300 256 326 Q316 300 420 214" fill="none" stroke="#E23F3F" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brazos -->
  <g fill="url(#brazo)" stroke="#C3CCD6" stroke-width="3">
    <path d="M22 215 C22 190 60 180 104 196 C114 200 112 214 106 228 C92 262 60 284 34 276 C18 270 14 240 22 215 Z"/>
    <path d="M490 215 C490 190 452 180 408 196 C398 200 400 214 406 228 C420 262 452 284 478 276 C494 270 498 240 490 215 Z"/>
  </g>

  <!-- Ojos -->
  <g>
    <circle cx="192" cy="148" r="27" fill="#05070D"/>
    <circle cx="320" cy="148" r="27" fill="#05070D"/>
    <circle cx="197" cy="144" r="10" fill="#19E3D0"/>
    <circle cx="325" cy="144" r="10" fill="#19E3D0"/>
  </g>

  <!-- Lentes -->
  <g fill="none" stroke="#141A24" stroke-width="7" stroke-linecap="round">
    <circle cx="192" cy="148" r="43" fill="#19E3D0" fill-opacity="0.08"/>
    <circle cx="320" cy="148" r="43" fill="#19E3D0" fill-opacity="0.08"/>
    <path d="M235 144 Q256 131 277 144"/>
    <path d="M149 142 L116 133"/>
    <path d="M363 142 L396 133"/>
  </g>

  <!-- Gafete con candado: los permisos los decide el servidor -->
  <rect x="246" y="316" width="20" height="18" rx="4" fill="#141A24"/>
  <rect x="222" y="330" width="68" height="84" rx="10" fill="url(#gafete)"/>
  <rect x="237" y="341" width="38" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.85"/>
  <path d="M245 374 V366 A11 11 0 0 1 267 366 V374" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
  <rect x="238" y="373" width="36" height="28" rx="6" fill="#FFFFFF"/>
  <circle cx="256" cy="384" r="4" fill="#B32626"/>
  <rect x="254" y="385" width="4" height="9" rx="2" fill="#B32626"/>
</svg>
