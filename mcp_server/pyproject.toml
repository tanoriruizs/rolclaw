[project]
name = "assistant"
version = "0.1.0"
description = "MCP + REST server: role-based permissions, filtered RAG, flows and approvals."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
