[project]
name = "assistant"
version = "0.1.0"
description = "MCP + REST server: role-based permissions, filtered RAG, flows and approvals."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "redis>=5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
