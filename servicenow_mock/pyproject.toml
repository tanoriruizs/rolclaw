[project]
name = "servicenow-mock"
version = "0.1.0"
description = "ServiceNow simulado: OAuth 2.0 client credentials y Table API (sc_request)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "redis>=5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
